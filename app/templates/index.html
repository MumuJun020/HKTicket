<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <title>抢票控制台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 单色系设计：只用黑白灰，状态靠字重和灰度区分，不靠颜色堆砌 */
    :root {
      --ink: #18181b;      /* 主文字 / 主按钮底色 */
      --ink-2: #52525b;    /* 次文字 */
      --ink-3: #a1a1aa;    /* 弱文字 */
      --line: #e4e4e7;     /* 边框 */
      --line-2: #f4f4f5;   /* 极浅分隔 */
      --bg: #fafafa;
    }
    /* 整页锁死一屏：卡片尺寸固定，滚动发生在卡片内部而不是整个页面。
       否则加到 10 个抢票人时列表会把页面撑长，一滚动顶栏和「开抢」按钮就跑没了。 */
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }

    /* 窄屏放弃锁死：一屏塞不下那么多卡片，退化成正常页面滚动 */
    @media (max-width: 1023px) {
      html, body { height: auto; overflow: visible; }
    }

    /* 需要内部滚动的区域统一样式，滚动条做细一点免得抢视线 */
    .scroll-y { overflow-y: auto; min-height: 0; }
    .scroll-y::-webkit-scrollbar { width: 6px; }
    .scroll-y::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 3px; }
    .scroll-y::-webkit-scrollbar-track { background: transparent; }
    .card { background:#fff; border:1px solid var(--line); border-radius:6px; }
    .hd { border-bottom:1px solid var(--line); }

    /* 按钮：主=黑底白字，次=白底细边，危险=白底红字（只在删除时出现） */
    .btn { font-size:13px; padding:6px 14px; border-radius:5px; border:1px solid var(--line);
           background:#fff; color:var(--ink); transition:.12s; white-space:nowrap; line-height:1.4; }
    .btn:hover { border-color:var(--ink-3); }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .btn-primary { background:var(--ink); color:#fff; border-color:var(--ink); }
    .btn-primary:hover { background:#000; border-color:#000; }
    .btn-sm { font-size:12px; padding:3px 9px; }
    .btn-danger:hover { color:#dc2626; border-color:#fca5a5; }

    /* 表单控件统一：细边框、聚焦时边框变黑而不是变蓝 */
    .inp, select.inp { border:1px solid var(--line); border-radius:5px; padding:6px 10px;
                       font-size:13px; background:#fff; color:var(--ink); outline:none; width:100%; }
    .inp:focus { border-color:var(--ink); }
    label.lbl { font-size:12px; color:var(--ink-2); display:block; margin-bottom:5px; }

    /* 状态点：在线用实心黑，其余用灰度层次。
       必须 inline-block——span 默认是 inline，宽高不生效，
       在表格单元格里会被压成一条竖线（flex 容器里碰巧正常，所以容易漏掉）。 */
    .dot { display:inline-block; width:6px; height:6px; border-radius:50%; flex-shrink:0; }
    .dot-on { background:var(--ink); }
    .dot-off { background:#d4d4d8; }
    .dot-idle { background:#fff; border:1px solid #d4d4d8; }
    .dot-err { background:#fff; border:1px solid #ef4444; }

    table.tb { width:100%; font-size:13px; border-collapse:collapse; }
    table.tb th { font-size:12px; font-weight:500; color:var(--ink-3); text-align:left;
                  padding:8px 10px; border-bottom:1px solid var(--line); }
    table.tb td { padding:9px 10px; border-bottom:1px solid var(--line-2); vertical-align:middle; }
    table.tb tr:last-child td { border-bottom:none; }

    .tag { font-size:11px; padding:2px 7px; border-radius:4px; border:1px solid var(--line); color:var(--ink-2); }
    .tag-out { color:var(--ink-3); text-decoration:line-through; background:var(--line-2); }

    /* ---------- 日期时间选择器：iOS 风格滚轮 ---------- */
    .dtp { position:fixed; z-index:60; right:24px; bottom:24px; width:min(520px, calc(100vw - 32px));
           background:rgba(255,255,255,.96); border:1px solid var(--line); border-radius:8px;
           box-shadow:0 18px 50px rgba(0,0,0,.18); overflow:hidden; backdrop-filter:blur(18px); }
    .dtp-hd { height:44px; display:flex; align-items:center; gap:10px; padding:0 12px;
              border-bottom:1px solid var(--line); }
    .dtp-wheel-wrap { position:relative; display:grid; grid-template-columns:1.7fr .8fr .8fr .8fr;
                      height:226px; padding:10px 12px; column-gap:8px; }
    .dtp-wheel-wrap::before { content:""; position:absolute; left:12px; right:12px; top:97px; height:32px;
                              border-top:1px solid var(--line); border-bottom:1px solid var(--line);
                              border-radius:5px; pointer-events:none; }
    .dtp-wheel-wrap::after { content:""; position:absolute; inset:10px 12px;
                             background:linear-gradient(#fff 0%, rgba(255,255,255,.72) 18%, rgba(255,255,255,0) 42%, rgba(255,255,255,0) 58%, rgba(255,255,255,.72) 82%, #fff 100%);
                             pointer-events:none; }
    .dtp-wheel { height:206px; overflow-y:auto; scroll-snap-type:y mandatory; scrollbar-width:none;
                 padding:87px 0; border-radius:6px; }
    .dtp-wheel::-webkit-scrollbar { display:none; }
    .dtp-item { height:32px; display:flex; align-items:center; justify-content:center; scroll-snap-align:center;
                font-size:13px; color:var(--ink-2); cursor:pointer; font-variant-numeric:tabular-nums; }
    .dtp-item.sel { color:var(--ink); font-weight:700; }
    .dtp-foot { height:44px; display:flex; align-items:center; gap:8px; padding:0 12px;
                border-top:1px solid var(--line); }
    @media (max-width: 640px) {
      .dtp { left:12px; right:12px; bottom:12px; width:auto; }
      .dtp-wheel-wrap { grid-template-columns:1.45fr .8fr .8fr .8fr; column-gap:4px; padding-left:8px; padding-right:8px; }
      .dtp-wheel-wrap::before { left:8px; right:8px; }
      .dtp-item { font-size:12px; }
    }
  </style>
</head>

<body>

  <!-- ======================= 顶栏 ======================= -->
  <header class="bg-white border-b shrink-0 z-30" style="border-color:var(--line)">
    <div class="w-full px-6 h-14 flex items-center gap-5">
      <h1 class="text-[15px] font-semibold tracking-tight">抢票控制台</h1>
      <span class="text-xs" style="color:var(--ink-3)">hkticketing</span>

      <div class="flex items-center gap-2.5 ml-1">
        <span id="status_summary" class="text-[13px]" style="color:var(--ink-2)">—</span>
        <button onclick="refreshLoginStatus()" id="btn_refresh_status" class="btn btn-sm"
          title="只查已打开的窗口，不会弹出新窗口">刷新状态</button>
      </div>

      <div class="flex-1"></div>
      <!-- 待支付提醒：锁到的单有付款时限，漏付就白抢，所以放在顶栏常驻，
           而不是埋在下面的战果卡片里等人自己去翻 -->
      <button onclick="scrollToResults()" id="pending_badge" class="btn btn-sm hidden"
              style="border-color:#b91c1c;color:#b91c1c" title="点击查看战果"></button>
      <button onclick="loginAll()" id="btn_login_all" class="btn btn-primary">一键启动并登录</button>
    </div>
  </header>

  <!-- 满屏自适应：宽度跟着视口走，高度占满剩余一屏。
       min-h-0 是关键——没有它，flex 子项不会收缩，内部的 overflow 就不生效。 -->
  <main class="flex-1 min-h-0 w-full px-6 py-6 grid grid-cols-12 gap-6">

    <!-- ---------- 左：抢票人 + 日志 ---------- -->
    <section class="col-span-12 lg:col-span-4 xl:col-span-3 flex flex-col gap-6 min-w-0 min-h-0">
      <!-- 固定占左栏 3/5 高度，跟里面有几个人无关。人多了在卡片内部滚。 -->
      <div class="card flex flex-col min-h-0" style="flex:3 1 0">
        <div class="hd px-4 h-12 flex items-center justify-between shrink-0">
          <div class="flex items-baseline gap-2">
            <h2 class="text-[13px] font-semibold">抢票人</h2>
            <span id="account_count" class="text-xs" style="color:var(--ink-3)"></span>
          </div>
          <div class="flex gap-1.5">
            <button onclick="toggleSelectMode()" id="btn_select_mode" class="btn btn-sm">选择</button>
            <button onclick="loadBrowsers()" id="btn_load_browsers" class="btn btn-sm">窗口</button>
            <button onclick="openAccountModal()" class="btn btn-sm btn-primary">新增</button>
          </div>
        </div>
        <!-- 批量操作条：只在「选择」模式下出现，平时不占地方 -->
        <!-- 两行布局：左栏窄，三个按钮和「全选 + 计数」挤在一行会把文字压成竖排 -->
        <div id="batch_bar" class="hidden px-4 py-2 flex flex-col gap-2 shrink-0"
             style="background:var(--line-2);border-bottom:1px solid var(--line)">
          <div class="flex items-center gap-2">
            <label class="flex items-center gap-1.5 text-xs cursor-pointer whitespace-nowrap" style="color:var(--ink-2)">
              <input type="checkbox" id="select_all" class="w-3.5 h-3.5 accent-black shrink-0" onchange="toggleSelectAll(this)" />
              <span>全选</span>
            </label>
            <span id="selected_count" class="text-xs whitespace-nowrap" style="color:var(--ink-3)"></span>
          </div>
          <div class="flex items-center gap-2 flex-wrap">
            <button onclick="clearLoginSelected()" id="btn_clear_login" class="btn btn-sm whitespace-nowrap" disabled>清除登录态</button>
            <div class="flex-1"></div>
            <button onclick="deleteSelected()" id="btn_del_selected" class="btn btn-sm btn-danger whitespace-nowrap" disabled>删除选中</button>
            <button onclick="deleteAllAccounts()" class="btn btn-sm btn-danger whitespace-nowrap">全部删除</button>
          </div>
        </div>
        <div id="account_list" class="scroll-y flex-1"></div>
      </div>

      <!-- 日志固定占 2/5，同样不随内容伸缩 -->
      <div class="card flex flex-col min-h-0" style="flex:2 1 0">
        <div class="hd px-4 h-10 flex items-center justify-between shrink-0">
          <h2 class="text-[13px] font-semibold">日志</h2>
          <button onclick="clearLog()" class="btn btn-sm" style="padding:2px 8px">清空</button>
        </div>
        <div id="log" class="scroll-y flex-1 px-4 py-2.5 font-mono text-[11px] leading-[1.7]"></div>
      </div>
    </section>

    <!-- ---------- 右 ----------
         overflow-y:auto 是兜底：整页锁死一屏时，右栏卡片一多（解析 + 配置 + 开抢 + 战果）
         在矮屏上会顶出视口，而 body 是 overflow:hidden 的，顶出去的部分永远够不着。
         内容装得下时不会出现滚动条，不影响正常观感。 -->
    <section class="col-span-12 lg:col-span-8 xl:col-span-9 flex flex-col gap-6 min-w-0 min-h-0 scroll-y">

      <!-- 解析 -->
      <div class="card shrink-0">
        <div class="hd px-4 h-12 flex items-center gap-3">
          <h2 class="text-[13px] font-semibold whitespace-nowrap">票务解析</h2>
          <input type="text" id="parse_event_url" class="inp flex-1 min-w-0"
            placeholder="活动详情页链接，或直接填 projectId" />
          <button onclick="parseEvent()" id="btn_parse" class="btn btn-primary">解析</button>
          <button onclick="toggleEventDetail()" class="btn btn-sm">明细</button>
        </div>
        <div class="px-4 py-3">
          <div id="event_bar" class="text-[13px]" style="color:var(--ink-2)"></div>
          <!-- 明细可能很长（18 个票档），限高内部滚，别把解析卡片撑起来 -->
          <div id="event_detail" class="hidden scroll-y mt-3 pt-3" style="border-top:1px solid var(--line-2);max-height:180px"></div>
        </div>
      </div>

      <!-- 配置：flex-1 吃掉中间的剩余高度，这样右栏底边和左栏对齐；
           人多时表格自己内部滚，不会把「开抢」挤出屏幕 -->
      <div class="card flex-1 flex flex-col min-h-[200px]">
        <div class="hd px-4 h-12 flex items-center gap-3 shrink-0">
          <h2 class="text-[13px] font-semibold whitespace-nowrap">配置每个人抢什么</h2>
          <span id="plan_summary" class="text-xs" style="color:var(--ink-3)"></span>
          <div class="flex-1"></div>
          <span id="plan_save_state" class="text-xs" style="color:var(--ink-3)"></span>
          <select id="bulk_session" class="inp btn-sm" style="width:auto;max-width:220px;padding:4px 8px">
            <option value="">批量设置场次…</option>
          </select>
          <button onclick="applyBulk()" class="btn btn-sm">应用到全部</button>
        </div>
        <div class="scroll-y flex-1 overflow-x-auto">
          <table class="tb">
            <thead class="sticky top-0 bg-white z-10">
              <tr>
                <th style="width:26px"></th>
                <th>抢票人</th>
                <th>场次</th>
                <th>票档</th>
                <th style="width:78px">张数</th>
              </tr>
            </thead>
            <tbody id="plan_list"></tbody>
          </table>
        </div>
      </div>

      <!-- 开抢 -->
      <div class="card shrink-0">
        <div class="hd px-4 h-12 flex items-center gap-2">
          <h2 class="text-[13px] font-semibold">开抢</h2>
          <span class="text-xs" style="color:var(--ink-3)">所有账号同时开抢，各按自己的配置</span>
        </div>

        <div class="px-4 py-4">
          <div class="grid grid-cols-12 gap-4">
            <div class="col-span-3">
              <label class="lbl">重试间隔（秒）</label>
              <div class="flex items-center gap-1.5">
                <input type="number" id="ticket_interval_min" step="0.5" value="2" min="0" class="inp" />
                <span class="text-xs" style="color:var(--ink-3)">~</span>
                <input type="number" id="ticket_interval_max" step="0.5" value="4" min="0" class="inp" />
              </div>
            </div>
            <div class="col-span-3">
              <label class="lbl">最大尝试（0 = 不限）</label>
              <input type="number" id="ticket_max_attempts" value="0" min="0" class="inp" />
            </div>
            <div class="col-span-6">
              <label class="lbl">
                定时开抢
                <span id="countdown_hint" class="ml-1.5 font-medium" style="color:var(--ink)"></span>
              </label>
              <div class="relative flex items-center gap-1.5">
                <input type="text" id="ticket_start_at" class="inp cursor-pointer" readonly
                  placeholder="点击选择日期时间（精确到秒）" onclick="openPicker(event)" onfocus="openPicker(event)" />
                <button onclick="clearStartAt()" class="btn btn-sm">清除</button>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-5 mt-4 pt-4" style="border-top:1px solid var(--line-2)">
            <label class="flex items-center gap-2 text-xs cursor-pointer" style="color:var(--ink-2)">
              <input type="checkbox" id="ticket_auto_confirm" class="w-3.5 h-3.5 accent-black" checked />
              <span>自动勾选条款并确认订单（锁单，<b style="color:var(--ink)">不付款</b>）</span>
            </label>
            <label class="flex items-center gap-2 text-xs cursor-pointer" style="color:var(--ink-2)">
              <input type="checkbox" id="ticket_stop_others" class="w-3.5 h-3.5 accent-black" />
              <span>有人抢到就停掉其他人</span>
            </label>
            <div class="flex-1"></div>
            <button onclick="grabTickets(false)" id="btn_grab_now" class="btn btn-primary">立即抢票</button>
            <button onclick="grabTickets(true)" id="btn_grab_scheduled" class="btn">定时抢票</button>
            <button onclick="toggleTicketPause()" id="btn_ticket_pause" data-state="running" style="display:none" class="btn">暂停</button>
            <button onclick="stopTicketTask()" id="btn_ticket_stop" style="display:none" class="btn btn-danger">停止</button>
          </div>
        </div>
      </div>

      <!-- 战果：整个流程的产出。程序只锁单不付款，这里每一条都对应一个等着人去付的订单。
           不随启动清空，要清只能按批次手动删。 -->
      <div class="card shrink-0" id="results_card">
        <div class="hd px-4 h-10 flex items-center justify-between shrink-0">
          <div class="flex items-center gap-2">
            <h2 class="text-[13px] font-semibold">战果</h2>
            <span id="results_summary" class="text-xs" style="color:var(--ink-3)"></span>
          </div>
          <div class="flex items-center gap-2">
            <select id="results_batch" onchange="renderResults()" class="inp" style="width:auto;max-width:260px;font-size:12px;padding:3px 8px">
              <option value="">全部批次</option>
            </select>
            <button onclick="exportResults()" id="btn_export_results" class="btn btn-sm">导出 CSV</button>
            <button onclick="deleteResultBatch()" id="btn_del_batch" class="btn btn-sm btn-danger">删除本批</button>
          </div>
        </div>
        <!-- 高度跟着视口走：固定 260px 在 1366x768 这种笔记本上会把卡片顶出屏幕，
             而整页是 overflow:hidden 的，顶出去就够不着了 -->
        <div id="results_body" class="scroll-y" style="max-height:min(260px, 26vh)"></div>
      </div>
    </section>
  </main>

  <!-- 抢票人弹窗 -->
  <div id="account_modal" class="fixed inset-0 z-40 hidden items-center justify-center p-4" style="background:rgba(0,0,0,.35)">
    <div class="card w-full max-w-md" style="border-radius:8px">
      <div class="hd px-5 h-12 flex items-center justify-between">
        <h3 id="modal_title" class="text-[13px] font-semibold">新增抢票人</h3>
        <button onclick="closeAccountModal()" class="text-lg leading-none" style="color:var(--ink-3)">&times;</button>
      </div>
      <div class="px-5 py-4 space-y-3.5">
        <div><label class="lbl">账号（邮箱）</label><input type="text" id="m_email" class="inp" /></div>
        <div><label class="lbl">密码</label><input type="text" id="m_password" class="inp font-mono" /></div>
        <div><label class="lbl">备注（选填）</label><input type="text" id="m_remark" class="inp" placeholder="列表里用来区分，比如「老王」" /></div>
        <div>
          <label class="lbl">浏览器窗口</label>
          <select id="m_browser" class="inp"></select>
          <p class="text-[11px] mt-1.5" style="color:var(--ink-3)">每人必须用独立窗口，共用会导致登录信息互相覆盖</p>
        </div>
        <div id="modal_error" class="text-xs hidden" style="color:#dc2626"></div>
      </div>
      <div class="hd px-5 h-12 flex items-center justify-end gap-2" style="border-bottom:none;border-top:1px solid var(--line)">
        <button onclick="closeAccountModal()" class="btn">取消</button>
        <button onclick="submitAccountModal()" id="m_submit" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 日期时间选择面板 -->
  <div id="dtp" class="dtp hidden">
    <div class="dtp-hd">
      <span class="text-[13px] font-semibold">定时开抢</span>
      <span id="dtp_preview" class="text-[12px] font-mono flex-1 truncate" style="color:var(--ink-2)"></span>
      <button onclick="closePicker()" class="btn btn-sm">取消</button>
      <button onclick="dtpConfirm()" class="btn btn-sm btn-primary">确定</button>
    </div>
    <div class="grid grid-cols-[1.7fr_.8fr_.8fr_.8fr] px-3 pt-2 text-[11px] text-center" style="color:var(--ink-3)">
      <div>日期</div>
      <div>时</div>
      <div>分</div>
      <div>秒</div>
    </div>
    <div class="dtp-wheel-wrap">
      <div id="dtp_date" class="dtp-wheel"></div>
      <div id="dtp_h" class="dtp-wheel"></div>
      <div id="dtp_m" class="dtp-wheel"></div>
      <div id="dtp_s" class="dtp-wheel"></div>
    </div>
    <div class="dtp-foot">
      <div class="flex-1"></div>
      <button onclick="dtpNow()" class="btn btn-sm">此刻</button>
      <button onclick="dtpQuick(5)" class="btn btn-sm">+5分</button>
      <button onclick="dtpTodayAt(13)" class="btn btn-sm">今天13:00</button>
    </div>
  </div>

  <script>
    // ==================== 全局状态 ====================
    let currentTaskId = null, currentTicketTaskId = null;
    let logEventSource = null, countdownElement = null;
    let isGlobalMode = false;
    let accounts = [], browsersCache = [], eventData = {}, plans = {};
    let loginStatus = {}, editingId = null;

    // ==================== 日志 ====================
    function appendLog(message, level = "info") {
      const box = document.getElementById("log");
      // 只有滚到底时才自动跟随，否则用户正在往回翻会被强行拽回来
      const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 24;
      const isCd = message.includes("[COUNTDOWN]");

      if (isCd) {
        // 倒计时原地刷新，不往下堆
        message = message.replace("[COUNTDOWN]", "").trim();
        if (countdownElement) {
          countdownElement.innerHTML = `<span style="color:var(--ink-3)">${countdownElement.dataset.ts}</span> <span style="color:var(--ink)">${escapeHtml(message)}</span>`;
        } else {
          const ts = `${new Date().toLocaleTimeString()}`;
          countdownElement = document.createElement("div");
          countdownElement.dataset.ts = ts;
          countdownElement.innerHTML = `<span style="color:var(--ink-3)">${ts}</span> <span style="color:var(--ink)">${escapeHtml(message)}</span>`;
          box.appendChild(countdownElement);
        }
      } else {
        if (countdownElement) { countdownElement.remove(); countdownElement = null; }
        const ts = new Date().toLocaleTimeString();
        const el = document.createElement("div");
        // 白底日志：错误用红，警告用主色加粗，普通用次级灰
        let c = "var(--ink-2)", w = "400";
        if (level === "error") { c = "#dc2626"; }
        else if (level === "warning") { c = "var(--ink)"; w = "500"; }
        el.innerHTML = `<span style="color:var(--ink-3)">${ts}</span> <span style="color:${c};font-weight:${w}">${escapeHtml(message)}</span>`;
        box.appendChild(el);
      }
      if (atBottom) box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(t) { const d = document.createElement("div"); d.textContent = t == null ? "" : t; return d.innerHTML; }

    function clearLog() {
      document.getElementById("log").innerHTML = "";
      countdownElement = null;
    }

    function initGlobalLogStream() {
      if (logEventSource) logEventSource.close();
      const es = new EventSource(`/ticket/logs_stream`);
      logEventSource = es; isGlobalMode = true; setupSSE(es);
    }

    function setupSSE(es) {
      es.addEventListener("message", ev => {
        try {
          const d = JSON.parse(ev.data);
          if (d.type === "log") {
            const e = d.data;
            if (isGlobalMode && currentTaskId && e.task_id === currentTaskId) return;
            appendLog(e.message, e.level);
            // 抢中就立刻刷新战果。这是用户最想立刻看到的东西——
            // 锁到的单在等付款，不该让他刷页面才看得见。
            if (e.message.includes("已记入战果")) loadResults();
            if (e.message.includes("抢票完成，成功账号") || e.message.includes("抢票结束，所有账号均未成功")) {
              setTimeout(() => {
                if (currentTicketTaskId) {
                  resetTicketButtons();
                  if (currentTaskId === currentTicketTaskId) stopLogPolling();
                  currentTicketTaskId = null;
                }
                loadResults();   // 收尾再拉一次，确保并发写入的都到齐了
              }, 500);
            }
            if (e.message.includes("一键登录结束") || e.message.includes("所有账号都已登录")) {
              setTimeout(refreshLoginStatus, 800);
            }
          } else if (d.type === "end" || d.type === "timeout") {
            appendLog(d.message || "日志流结束", "warning"); stopLogPolling();
          } else if (d.type === "error") {
            appendLog(`错误: ${d.message}`, "error");
          }
        } catch (err) { console.error(err); }
      });
      es.addEventListener("error", () => { if (es.readyState === EventSource.CLOSED) stopLogPolling(); });
    }

    function startLogPolling(taskId) {
      currentTaskId = taskId; countdownElement = null;
      if (logEventSource) logEventSource.close();
      const es = new EventSource(`/ticket/logs_stream?task_id=${taskId}`);
      logEventSource = es; isGlobalMode = false; setupSSE(es);
    }

    function stopLogPolling() {
      const wasTask = !isGlobalMode;
      if (logEventSource) { logEventSource.close(); logEventSource = null; }
      currentTaskId = null; isGlobalMode = false;
      if (wasTask) setTimeout(initGlobalLogStream, 100);
    }

    // ==================== 抢票人 ====================
    const ST = {
      logged_in:     { dot: "dot-on",   text: "已登录",   dim: false },
      logged_out:    { dot: "dot-off",  text: "未登录",   dim: true },
      window_closed: { dot: "dot-idle", text: "窗口未开", dim: true },
      no_window:     { dot: "dot-err",  text: "未绑窗口", dim: true },
      error:         { dot: "dot-err",  text: "异常",     dim: true },
      unknown:       { dot: "dot-idle", text: "—",        dim: true },
    };

    function loadAccounts() {
      return fetch("/ticket/accounts").then(r => r.json()).then(d => {
        if (d.code === 200) { accounts = d.accounts || []; renderAccounts(); renderPlans(); }
        else appendLog(d.result, "error");
      }).catch(e => appendLog(`加载抢票人失败: ${e.message}`, "error"));
    }

    function renderAccounts() {
      const box = document.getElementById("account_list");
      document.getElementById("account_count").textContent = accounts.length ? `${accounts.length}` : "";
      box.innerHTML = "";
      if (!accounts.length) {
        box.innerHTML = `<div class="px-4 py-10 text-center text-[13px]" style="color:var(--ink-3)">
          还没有抢票人<br><span class="text-[11px]">点右上角「新增」</span></div>`;
        updateStatusSummary(); return;
      }
      accounts.forEach((a, i) => {
        const st = ST[(loginStatus[a.id] || {}).status] || ST.unknown;
        const win = browsersCache.find(b => b.id === a.browser_id);
        const winLabel = win ? `#${win.seq} ${win.name}` : (a.browser_id ? "窗口未加载" : "未绑定");
        const row = document.createElement("div");
        row.className = "px-4 py-2.5 group hover:bg-zinc-50";
        row.dataset.accId = a.id;
        if (i) row.style.borderTop = "1px solid var(--line-2)";
        row.innerHTML = `
          <div class="flex items-center gap-2">
            <input type="checkbox" class="acc-check w-3.5 h-3.5 accent-black ${selectMode ? "" : "hidden"}"
                   value="${escapeHtml(a.id)}" onchange="updateSelectedCount()" />
            <span class="dot ${st.dot}" title="${escapeHtml((loginStatus[a.id]||{}).detail || st.text)}"></span>
            <span class="text-[13px] font-medium truncate flex-1">${escapeHtml(a.remark || a.email)}</span>
            <span class="text-[11px]" style="color:var(--${st.dim ? 'ink-3' : 'ink'})">${st.text}</span>
            <button class="btn btn-sm edit-btn opacity-0 group-hover:opacity-100" style="padding:1px 6px">改</button>
            <button class="btn btn-sm btn-danger del-btn opacity-0 group-hover:opacity-100" style="padding:1px 6px">删</button>
          </div>
          <div class="flex items-center gap-1.5 mt-1 text-[11px] ${selectMode ? "pl-9" : "pl-3.5"}" style="color:var(--ink-3)">
            <span class="truncate">${escapeHtml(a.email)}</span><span>·</span>
            <span class="truncate" ${a.browser_id ? "" : 'style="color:#ef4444"'}>${escapeHtml(winLabel)}</span>
          </div>`;
        row.querySelector(".edit-btn").onclick = () => openAccountModal(a.id);
        row.querySelector(".del-btn").onclick = () => deleteAccount(a.id, a.remark || a.email);
        box.appendChild(row);
      });
      updateStatusSummary();
    }

    function updateStatusSummary() {
      const el = document.getElementById("status_summary");
      if (!accounts.length) { el.textContent = "—"; return; }
      const n = accounts.filter(a => (loginStatus[a.id] || {}).status === "logged_in").length;
      const known = accounts.filter(a => loginStatus[a.id]).length;
      el.innerHTML = known
        ? `<b style="color:var(--ink)">${n}</b><span style="color:var(--ink-3)"> / ${accounts.length} 已登录</span>`
        : `<span style="color:var(--ink-3)">${accounts.length} 人 · 状态未知</span>`;
    }

    function openAccountModal(id = null) {
      editingId = id;
      const a = id ? accounts.find(x => x.id === id) : null;
      document.getElementById("modal_title").textContent = a ? "编辑抢票人" : "新增抢票人";
      document.getElementById("m_email").value = a ? a.email : "";
      document.getElementById("m_password").value = a ? a.password : "";
      document.getElementById("m_remark").value = a ? a.remark : "";
      document.getElementById("modal_error").classList.add("hidden");
      const sel = document.getElementById("m_browser");
      sel.innerHTML = browsersCache.length
        ? '<option value="">— 未绑定 —</option>' + browsersCache.map(b => {
            const taken = accounts.find(x => x.id !== id && x.browser_id === b.id);
            const label = `#${b.seq ?? "?"} ${b.name || "(未命名)"}` + (taken ? `（已被 ${taken.remark || taken.email} 占用）` : "");
            return `<option value="${escapeHtml(b.id)}"${taken ? " disabled" : ""}${a && a.browser_id === b.id ? " selected" : ""}>${escapeHtml(label)}</option>`;
          }).join("")
        : '<option value="">先点左上角「窗口」加载列表</option>';
      const m = document.getElementById("account_modal");
      m.classList.remove("hidden"); m.classList.add("flex");
      document.getElementById("m_email").focus();
    }

    function closeAccountModal() {
      const m = document.getElementById("account_modal");
      m.classList.add("hidden"); m.classList.remove("flex"); editingId = null;
    }

    function submitAccountModal() {
      const payload = {
        email: document.getElementById("m_email").value.trim(),
        password: document.getElementById("m_password").value,
        remark: document.getElementById("m_remark").value.trim(),
        browser_id: document.getElementById("m_browser").value,
      };
      if (editingId) payload.id = editingId;
      const err = document.getElementById("modal_error");
      if (!payload.email || !payload.password) {
        err.textContent = "账号和密码都是必填的"; err.classList.remove("hidden"); return;
      }
      const btn = document.getElementById("m_submit");
      btn.disabled = true; btn.textContent = "保存中…";
      fetch("/ticket/accounts/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
        .then(r => r.json()).then(d => {
          if (d.code === 200) { closeAccountModal(); appendLog(editingId ? "抢票人已更新" : "抢票人已新增"); loadAccounts(); }
          else { err.textContent = d.result || "保存失败"; err.classList.remove("hidden"); }
        }).catch(e => { err.textContent = e.message; err.classList.remove("hidden"); })
        .finally(() => { btn.disabled = false; btn.textContent = "保存"; });
    }

    function deleteAccount(id, label) {
      if (!confirm(`确定删除「${label}」？他的抢票配置也会一并删除。`)) return;
      fetch("/ticket/accounts/delete", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }) })
        .then(r => r.json()).then(d => {
          appendLog(d.result, d.code === 200 ? "warning" : "error");
          if (d.code === 200) { delete loginStatus[id]; loadAccounts(); }
        });
    }

    // ---------- 批量选择 / 删除 ----------
    let selectMode = false;

    function toggleSelectMode() {
      selectMode = !selectMode;
      document.getElementById("batch_bar").classList.toggle("hidden", !selectMode);
      document.getElementById("btn_select_mode").textContent = selectMode ? "取消" : "选择";
      document.getElementById("btn_select_mode").classList.toggle("btn-primary", selectMode);
      document.getElementById("select_all").checked = false;
      renderAccounts();
      updateSelectedCount();
    }

    function toggleSelectAll(master) {
      document.querySelectorAll(".acc-check").forEach(c => { c.checked = master.checked; });
      updateSelectedCount();
    }

    function selectedIds() {
      return [...document.querySelectorAll(".acc-check:checked")].map(c => c.value);
    }

    function updateSelectedCount() {
      const n = selectedIds().length;
      const total = document.querySelectorAll(".acc-check").length;
      document.getElementById("selected_count").textContent = n ? `已选 ${n}` : "";
      document.getElementById("btn_del_selected").disabled = n === 0;
      document.getElementById("btn_clear_login").disabled = n === 0;
      const master = document.getElementById("select_all");
      master.checked = n > 0 && n === total;
      master.indeterminate = n > 0 && n < total;   // 部分选中时显示横杠
    }

    // 渲染后恢复"全选"状态，否则重渲染会让计数和勾选框对不上
    function updatePlanSelectAll() { if (selectMode) updateSelectedCount(); }

    function deleteSelected() {
      const ids = selectedIds();
      if (!ids.length) return;
      const names = accounts.filter(a => ids.includes(a.id)).map(a => a.remark || a.email);
      if (!confirm(`确定删除这 ${ids.length} 个抢票人？\n\n${names.join("、")}\n\n他们的抢票配置也会一并删除。`)) return;
      batchDelete(ids);
    }

    function deleteAllAccounts() {
      if (!accounts.length) return;
      if (!confirm(`确定删除全部 ${accounts.length} 个抢票人？所有抢票配置也会一并清空。`)) return;
      batchDelete(accounts.map(a => a.id));
    }

    function batchDelete(ids) {
      fetch("/ticket/accounts/delete_batch", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ids })
      }).then(r => r.json()).then(d => {
        appendLog(d.result, d.code === 200 ? "warning" : "error");
        if (d.code === 200) {
          ids.forEach(id => delete loginStatus[id]);
          if (selectMode) toggleSelectMode();   // 删完退出选择模式
          else loadAccounts();
        }
      }).catch(e => appendLog(`批量删除失败: ${e.message}`, "error"));
    }

    // 手动清除登录态。正常换人时后端会按窗口归属自动清，这里是人工兜底：
    // 窗口被风控盯上想推倒重来、或者就是想让某个人重新登一次。
    function clearLoginSelected() {
      const ids = selectedIds();
      if (!ids.length) return;
      const names = accounts.filter(a => ids.includes(a.id)).map(a => a.remark || a.email);
      if (!confirm(
        `确定清除这 ${ids.length} 个人所绑定窗口的登录态？\n\n${names.join("、")}\n\n` +
        `窗口会被关闭，Cookie 和本地存储一并清空。\n下次登录需要重新处理验证码。`
      )) return;

      const btn = document.getElementById("btn_clear_login");
      btn.disabled = true; btn.textContent = "清除中…";
      fetch("/ticket/accounts/clear_login", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ids })
      }).then(r => r.json()).then(d => {
        appendLog(d.result, d.code === 200 ? "warning" : "error");
        if (d.code === 200) ids.forEach(id => delete loginStatus[id]);
        renderAccounts();
      }).catch(e => appendLog(`清除登录态失败: ${e.message}`, "error"))
        .finally(() => { btn.textContent = "清除登录态"; updateSelectedCount(); });
    }

    function refreshLoginStatus() {
      if (!accounts.length) return Promise.resolve();
      const btn = document.getElementById("btn_refresh_status");
      btn.disabled = true; btn.textContent = "查询中…";
      return fetch("/ticket/login_status").then(r => r.json()).then(d => {
        if (d.code === 200) {
          loginStatus = {};
          (d.statuses || []).forEach(s => { loginStatus[s.account_id] = s; });
          renderAccounts(); renderPlans();
        } else appendLog(d.result, "error");
      }).catch(e => appendLog(`查询登录状态失败: ${e.message}`, "error"))
        .finally(() => { btn.disabled = false; btn.textContent = "刷新状态"; });
    }

    function loadBrowsers() {
      const btn = document.getElementById("btn_load_browsers");
      btn.disabled = true; btn.textContent = "…";
      return fetch("/ticket/browsers").then(r => r.json()).then(d => {
        if (d.code === 200) { browsersCache = d.browsers || []; renderAccounts(); }
        else appendLog(d.result, "error");
      }).catch(e => appendLog(`加载窗口失败: ${e.message}`, "error"))
        .finally(() => { btn.disabled = false; btn.textContent = "窗口"; });
    }

    function loginAll() {
      const btn = document.getElementById("btn_login_all");
      btn.disabled = true; btn.textContent = "登录中…";
      fetch("/ticket/login_all", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ wait_captcha_seconds: 180 }) })
        .then(r => r.json()).then(d => {
          if (d.task_id) startLogPolling(d.task_id);
          appendLog(d.result, d.code === 200 ? "info" : "error");
        }).catch(e => appendLog(`一键登录失败: ${e.message}`, "error"))
        .finally(() => { btn.disabled = false; btn.textContent = "一键启动并登录"; });
    }

    // ==================== 解析 ====================
    function loadEvent() {
      return fetch("/ticket/event").then(r => r.json()).then(d => {
        if (d.code === 200 && d.event && d.event.sessions) { eventData = d.event; renderEventBar(); renderPlans(); }
      }).catch(() => { });
    }

    function parseEvent() {
      const url = document.getElementById("parse_event_url").value.trim();
      if (!url) { appendLog("请填写活动链接或 projectId", "error"); return; }
      const btn = document.getElementById("btn_parse");
      btn.disabled = true; btn.textContent = "解析中…";
      fetch("/ticket/parse_event", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ event_url: url }) })
        .then(r => r.json()).then(d => {
          appendLog(d.result, d.code === 200 ? "info" : "error");
          if (d.code === 200) { eventData = d.event || {}; renderEventBar(); renderPlans(); }
        }).catch(e => appendLog(`解析失败: ${e.message}`, "error"))
        .finally(() => { btn.disabled = false; btn.textContent = "解析"; });
    }

    function renderEventBar() {
      const bar = document.getElementById("event_bar");
      if (!eventData.sessions || !eventData.sessions.length) {
        bar.innerHTML = `<span style="color:var(--ink-3)">还没有解析结果</span>`; return;
      }
      const total = eventData.sessions.reduce((n, s) => n + s.tiers.length, 0);
      const avail = eventData.sessions.reduce((n, s) => n + s.tiers.filter(t => t.available).length, 0);
      bar.innerHTML = `<b style="color:var(--ink)">${escapeHtml(eventData.name)}</b>
        <span style="color:var(--ink-3)"> · ${eventData.sessions.length} 场次 / ${total} 票档 · </span>
        <b>${avail ? avail + " 个可买" : "全部售罄"}</b>`;
      if (!document.getElementById("parse_event_url").value) {
        document.getElementById("parse_event_url").value = eventData.event_url || "";
      }
      renderEventDetail(); fillBulkSession();
    }

    function renderEventDetail() {
      const box = document.getElementById("event_detail");
      if (!eventData.sessions) return;
      box.innerHTML = eventData.sessions.map(s => `
        <div class="mb-2.5">
          <div class="text-[12px] font-medium" ${s.sell_out ? 'style="color:var(--ink-3)"' : ""}>
            ${escapeHtml(s.text)}${s.sell_out ? ' <span class="text-[11px]">· 整场售罄</span>' : ""}
          </div>
          <div class="flex flex-wrap gap-1.5 mt-1.5">
            ${s.tiers.map(t => `<span class="tag ${t.available ? "" : "tag-out"}">${escapeHtml(t.text)}</span>`).join("")}
          </div>
        </div>`).join("");
    }

    function toggleEventDetail() { document.getElementById("event_detail").classList.toggle("hidden"); }

    // ==================== 配置 ====================
    function loadPlans() {
      return fetch("/ticket/plans").then(r => r.json()).then(d => {
        if (d.code === 200) { plans = d.plans || {}; renderPlans(); }
      }).catch(() => { });
    }

    function fillBulkSession() {
      const sel = document.getElementById("bulk_session");
      sel.innerHTML = '<option value="">批量设置场次…</option>' +
        (eventData.sessions || []).map(s => `<option value="${escapeHtml(s.text)}"${s.sell_out ? " disabled" : ""}>${escapeHtml(s.text)}${s.sell_out ? "（售罄）" : ""}</option>`).join("");
    }

    function renderPlans() {
      const box = document.getElementById("plan_list");
      const sum = document.getElementById("plan_summary");
      box.innerHTML = "";
      if (!accounts.length) {
        box.innerHTML = `<tr><td colspan="5" class="text-center py-10 text-[13px]" style="color:var(--ink-3)">先在左边添加抢票人</td></tr>`;
        sum.textContent = ""; return;
      }
      if (!eventData.sessions || !eventData.sessions.length) {
        box.innerHTML = `<tr><td colspan="5" class="text-center py-10 text-[13px]" style="color:var(--ink-3)">先解析活动，这里才能选场次和票档</td></tr>`;
        sum.textContent = ""; return;
      }
      let configured = 0;
      accounts.forEach(a => {
        const plan = plans[a.id] || {};
        if (plan.session_text && plan.tier_text) configured++;
        const st = ST[(loginStatus[a.id] || {}).status] || ST.unknown;
        const tr = document.createElement("tr");
        tr.dataset.accountId = a.id;
        tr.innerHTML = `
          <td><span class="dot ${st.dot}" title="${st.text}"></span></td>
          <td>
            <div class="text-[13px] font-medium truncate" style="max-width:150px">${escapeHtml(a.remark || a.email)}</div>
            <div class="text-[11px] truncate" style="max-width:150px;color:var(--ink-3)">${escapeHtml(a.email)}</div>
          </td>
          <td><select class="inp plan-session"></select></td>
          <td><select class="inp plan-tier"></select></td>
          <td><input type="number" min="1" value="${plan.quantity || 1}" class="inp plan-qty" style="width:64px" /></td>`;
        box.appendChild(tr);
        const ss = tr.querySelector(".plan-session"), ts = tr.querySelector(".plan-tier");
        // 售罄的场次/票档**照样可选**，只加文字标记。
        // 抢回流票就是要预先配好一个当前售罄的票档，然后让程序一直轮询，
        // 等别人退票放出来的那一刻抢进去。禁选的话这个场景根本没法配。
        ss.innerHTML = '<option value="">— 场次 —</option>' + eventData.sessions.map(s =>
          `<option value="${escapeHtml(s.text)}"${s.text === plan.session_text ? " selected" : ""}>${escapeHtml(s.text)}${s.sell_out ? " · 售罄" : ""}</option>`).join("");
        const fill = () => {
          const s = eventData.sessions.find(x => x.text === ss.value);
          ts.innerHTML = '<option value="">— 票档 —</option>' + (s ? s.tiers : []).map(t =>
            `<option value="${escapeHtml(t.text)}"${t.text === plan.tier_text ? " selected" : ""}>${escapeHtml(t.text)}${t.available ? "" : " · 售罄"}</option>`).join("");
          markSoldOut(tr);
        };
        fill();
        ss.onchange = () => { fill(); autoSavePlans(); };
        // 改票档要同时刷新售罄提示，不然选中售罄票档后看不出虚线标记
        ts.onchange = () => { markSoldOut(tr); autoSavePlans(); };
        tr.querySelector(".plan-qty").oninput = autoSavePlans;
      });
      sum.textContent = `${configured}/${accounts.length} 已配置`;
      updatePlanSelectAll();
    }

    // 选中售罄票档时给个视觉提示（虚线边框），但不阻止选择——
    // 这是"等回流票"的合法配置，只是要让人一眼看出这行现在抢不到、在等放票
    function markSoldOut(tr) {
      const ts = tr.querySelector(".plan-tier");
      const opt = ts.options[ts.selectedIndex];
      const isOut = opt && opt.textContent.includes("· 售罄");
      ts.style.borderStyle = isOut ? "dashed" : "solid";
      ts.style.borderColor = isOut ? "var(--ink-3)" : "";
      ts.title = isOut ? "该票档当前售罄。抢票会持续轮询，等有人退票放出来时抢入" : "";
    }

    function applyBulk() {
      const v = document.getElementById("bulk_session").value;
      if (!v) { appendLog("请先在下拉里选一个场次", "error"); return; }
      document.querySelectorAll("#plan_list tr[data-account-id]").forEach(tr => {
        const ss = tr.querySelector(".plan-session");
        ss.value = v; ss.dispatchEvent(new Event("change"));
        const ts = tr.querySelector(".plan-tier");
        // 优先挑还有票的票档；全售罄时也挑第一个（等回流），不留空
        const opts = [...ts.options].filter(o => o.value);
        const pick = opts.find(o => !o.textContent.includes("· 售罄")) || opts[0];
        if (pick) { ts.value = pick.value; markSoldOut(tr); }
      });
      autoSavePlans();
      appendLog(`已把全部抢票人设为「${v}」`);
    }

    // 配置改动即存。抢票场景下"忘了点保存"的代价太大——开抢那一刻才发现
    // 配置没生效就来不及了，所以不让保存这件事依赖人的记性。
    let planSaveTimer = null;
    function autoSavePlans(silent = true) {
      clearTimeout(planSaveTimer);
      setPlanSaveState("saving");
      planSaveTimer = setTimeout(() => {
        const out = {};
        document.querySelectorAll("#plan_list tr[data-account-id]").forEach(tr => {
          out[tr.dataset.accountId] = {
            session_text: tr.querySelector(".plan-session").value,
            tier_text: tr.querySelector(".plan-tier").value,
            quantity: parseInt(tr.querySelector(".plan-qty").value) || 1,
          };
        });
        fetch("/ticket/plans/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ plans: out }) })
          .then(r => r.json()).then(d => {
            if (d.code === 200) {
              plans = out;
              setPlanSaveState("saved");
              // 只更新计数，不整表重渲染——重渲染会打断正在操作的下拉框
              const n = Object.values(out).filter(p => p.session_text && p.tier_text).length;
              document.getElementById("plan_summary").textContent = `${n}/${accounts.length} 已配置`;
              if (!silent) appendLog(d.result);
            } else {
              setPlanSaveState("error");
              appendLog(d.result || "保存配置失败", "error");
            }
          }).catch(e => { setPlanSaveState("error"); appendLog(`保存配置失败: ${e.message}`, "error"); });
      }, 500);
    }

    function setPlanSaveState(s) {
      const el = document.getElementById("plan_save_state");
      if (!el) return;
      if (s === "saving") { el.textContent = "保存中…"; el.style.color = "var(--ink-3)"; }
      else if (s === "saved") {
        el.textContent = "已保存"; el.style.color = "var(--ink-2)";
        clearTimeout(el.__t); el.__t = setTimeout(() => { el.textContent = ""; }, 2000);
      } else { el.textContent = "保存失败"; el.style.color = "#dc2626"; }
    }

    // ==================== 日期时间选择器 ====================
    // iOS 风格滚轮。输入框为空时也先落到 5 分钟后，避免没有基础时间导致时分秒列不可操作。
    let dtpSel = null;
    let dtpScrollTimers = {};
    const DTP_ITEM_H = 32;
    const DTP_DATE_BEFORE = 1;
    const DTP_DATE_AFTER = 365;

    function pad(n) { return String(n).padStart(2, "0"); }
    function fmt(d) {
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function openPicker(e) {
      if (e) e.stopPropagation();
      const inp = document.getElementById("ticket_start_at");
      const p = document.getElementById("dtp");
      dtpSel = parsePickerValue(inp.value) || new Date(Date.now() + 300000);
      p.classList.remove("hidden");
      renderPicker();
    }

    function closePicker() { document.getElementById("dtp").classList.add("hidden"); }

    function parsePickerValue(v) {
      if (!v) return null;
      const d = new Date(v.replace(/-/g, "/"));
      return isNaN(d) ? null : d;
    }

    function dateKey(d) {
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    function dateLabel(d) {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const base = new Date(d); base.setHours(0, 0, 0, 0);
      const diff = Math.round((base - today) / 86400000);
      const week = ["日", "一", "二", "三", "四", "五", "六"][d.getDay()];
      if (diff === 0) return `今天 ${pad(d.getMonth() + 1)}/${pad(d.getDate())} 周${week}`;
      if (diff === 1) return `明天 ${pad(d.getMonth() + 1)}/${pad(d.getDate())} 周${week}`;
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} 周${week}`;
    }

    function dateOptions() {
      const base = new Date(); base.setHours(0, 0, 0, 0); base.setDate(base.getDate() - DTP_DATE_BEFORE);
      const out = [];
      for (let i = 0; i <= DTP_DATE_BEFORE + DTP_DATE_AFTER; i++) {
        const d = new Date(base); d.setDate(base.getDate() + i);
        out.push({ value: dateKey(d), label: dateLabel(d) });
      }
      return out;
    }

    function numberOptions(n) {
      return Array.from({ length: n }, (_, i) => ({ value: String(i), label: pad(i) }));
    }

    function renderPicker() {
      if (!dtpSel || isNaN(dtpSel)) dtpSel = new Date(Date.now() + 300000);
      renderWheel("dtp_date", dateOptions(), dateKey(dtpSel));
      renderWheel("dtp_h", numberOptions(24), String(dtpSel.getHours()));
      renderWheel("dtp_m", numberOptions(60), String(dtpSel.getMinutes()));
      renderWheel("dtp_s", numberOptions(60), String(dtpSel.getSeconds()));
      document.getElementById("dtp_preview").textContent = fmt(dtpSel);
    }

    function renderWheel(id, options, selected) {
      const el = document.getElementById(id);
      const same = el.dataset.options === JSON.stringify(options.map(o => o.value));
      if (!same) {
        el.innerHTML = options.map((o, i) =>
          `<div class="dtp-item" data-value="${escapeHtml(o.value)}" data-idx="${i}" onclick="dtpPickWheel('${id}', '${escapeHtml(o.value)}')">${escapeHtml(o.label)}</div>`).join("");
        el.dataset.options = JSON.stringify(options.map(o => o.value));
        el.onscroll = () => scheduleWheelSnap(id);
      }
      el.querySelectorAll(".dtp-item").forEach(item => item.classList.toggle("sel", item.dataset.value === selected));
      const item = [...el.querySelectorAll(".dtp-item")].find(x => x.dataset.value === selected) || el.querySelector(".dtp-item");
      if (item) {
        const targetTop = parseInt(item.dataset.idx, 10) * DTP_ITEM_H;
        if (Math.abs(el.scrollTop - targetTop) > 1) el.scrollTop = targetTop;
      }
    }

    function scheduleWheelSnap(id) {
      clearTimeout(dtpScrollTimers[id]);
      dtpScrollTimers[id] = setTimeout(() => {
        const el = document.getElementById(id);
        const items = [...el.querySelectorAll(".dtp-item")];
        if (!items.length) return;
        const idx = Math.max(0, Math.min(items.length - 1, Math.round(el.scrollTop / DTP_ITEM_H)));
        dtpPickWheel(id, items[idx].dataset.value);
      }, 90);
    }

    function dtpPickWheel(id, value) {
      if (!dtpSel || isNaN(dtpSel)) dtpSel = new Date(Date.now() + 300000);
      if (id === "dtp_date") {
        const [y, m, d] = value.split("-").map(Number);
        dtpSel.setFullYear(y, m - 1, d);
      } else if (id === "dtp_h") {
        dtpSel.setHours(parseInt(value, 10));
      } else if (id === "dtp_m") {
        dtpSel.setMinutes(parseInt(value, 10));
      } else {
        dtpSel.setSeconds(parseInt(value, 10));
      }
      renderPicker();
    }

    function dtpNow() { dtpSel = new Date(); renderPicker(); }
    function dtpQuick(min) { dtpSel = new Date(Date.now() + min * 60000); dtpSel.setSeconds(0); renderPicker(); }
    function dtpTodayAt(h) { const d = new Date(); d.setHours(h, 0, 0, 0); dtpSel = d; renderPicker(); }

    function dtpConfirm() {
      if (!dtpSel || isNaN(dtpSel)) dtpSel = new Date(Date.now() + 300000);
      document.getElementById("ticket_start_at").value = fmt(dtpSel);
      closePicker(); updateCountdownHint();
    }

    function clearStartAt() {
      document.getElementById("ticket_start_at").value = "";
      updateCountdownHint();
    }

    function updateCountdownHint() {
      const hint = document.getElementById("countdown_hint");
      const v = document.getElementById("ticket_start_at").value;
      if (!v) { hint.textContent = ""; return; }
      const diff = new Date(v.replace(/-/g, "/")).getTime() - Date.now();
      if (diff <= 0) { hint.innerHTML = '<span style="color:#dc2626">该时间已过</span>'; return; }
      const s = Math.floor(diff / 1000);
      const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
      hint.textContent = "· 还有 " + (d ? `${d}天` : "") + (h ? `${h}时` : "") + (m ? `${m}分` : "") + `${sec}秒`;
    }
    setInterval(updateCountdownHint, 1000);

    // ==================== 抢票 ====================
    function resetTicketButtons() {
      const p = document.getElementById("btn_ticket_pause");
      p.dataset.state = "running"; p.textContent = "暂停"; p.style.display = "none";
      document.getElementById("btn_grab_now").style.display = "";
      document.getElementById("btn_grab_scheduled").style.display = "";
      document.getElementById("btn_ticket_stop").style.display = "none";
    }

    function grabTickets(scheduled) {
      const payload = {
        max_attempts: parseInt(document.getElementById("ticket_max_attempts").value) || 0,
        retry_interval_min: parseFloat(document.getElementById("ticket_interval_min").value) || 2.0,
        retry_interval_max: parseFloat(document.getElementById("ticket_interval_max").value) || 4.0,
        stop_others_on_success: document.getElementById("ticket_stop_others").checked,
        auto_confirm: document.getElementById("ticket_auto_confirm").checked,
      };
      if (scheduled) {
        const at = document.getElementById("ticket_start_at").value;
        if (!at) { appendLog("请先设置开抢时间", "error"); return; }
        payload.start_at = at;   // 已经是 YYYY-MM-DD HH:MM:SS，后端直接能解析
      }
      fetch("/ticket/do_grab", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
        .then(r => r.json()).then(d => {
          if (d.task_id && d.code === 200) {
            currentTicketTaskId = d.task_id; startLogPolling(d.task_id);
            document.getElementById("btn_grab_now").style.display = "none";
            document.getElementById("btn_grab_scheduled").style.display = "none";
            document.getElementById("btn_ticket_pause").style.display = "";
            document.getElementById("btn_ticket_stop").style.display = "";
          }
          appendLog(d.result, d.code === 200 ? "info" : "error");
        }).catch(e => appendLog(`请求失败: ${e.message}`, "error"));
    }

    function toggleTicketPause() {
      if (!currentTicketTaskId) return;
      const btn = document.getElementById("btn_ticket_pause");
      const action = btn.dataset.state === "paused" ? "resume" : "pause";
      fetch("/ticket/control_task", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ task_id: currentTicketTaskId, action }) })
        .then(r => r.json()).then(d => {
          if (d.code === 200) {
            btn.dataset.state = action === "pause" ? "paused" : "running";
            btn.textContent = action === "pause" ? "恢复" : "暂停";
          }
          appendLog(d.result, d.code === 200 ? "warning" : "error");
        });
    }

    function stopTicketTask() {
      if (!currentTicketTaskId) return;
      fetch("/ticket/control_task", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ task_id: currentTicketTaskId, action: "stop" }) })
        .then(r => r.json()).then(d => {
          resetTicketButtons(); currentTicketTaskId = null;
          appendLog(d.result, d.code === 200 ? "warning" : "error");
        });
    }

    // ==================== 初始化 ====================
    window.addEventListener("beforeunload", () => stopLogPolling());
    document.addEventListener("click", e => {
      const p = document.getElementById("dtp");
      if (!p.classList.contains("hidden") && !p.contains(e.target) && e.target.id !== "ticket_start_at") closePicker();
    });
    document.addEventListener("keydown", e => {
      if (e.key !== "Escape") return;
      if (!document.getElementById("account_modal").classList.contains("hidden")) closeAccountModal();
      closePicker();
    });


    // ---------- 战果 ----------
    // 这是整个流程的产出：程序只锁单不付款，每条记录都是一个等着人去付的订单。
    let resultsData = { batches: {}, items: [] };

    function loadResults() {
      return fetch("/ticket/results").then(r => r.json()).then(d => {
        if (d.code !== 200) return;
        resultsData = { batches: d.batches || {}, items: d.items || [] };
        renderBatchOptions();
        renderResults();
      }).catch(() => {});
    }

    function renderBatchOptions() {
      const sel = document.getElementById("results_batch");
      const keep = sel.value;
      // 批次按开始时间倒序，最近抢的那批排最前面——通常就是你想看的那批
      const list = Object.values(resultsData.batches)
        .sort((a, b) => (b.started_at || "").localeCompare(a.started_at || ""));
      sel.innerHTML = '<option value="">全部批次</option>' + list.map(b => {
        const when = (b.started_at || "").replace("T", " ").slice(5, 16);
        return `<option value="${b.batch_id}">${when} ${escapeHtml(b.event_name)}</option>`;
      }).join("");
      if ([...sel.options].some(o => o.value === keep)) sel.value = keep;
    }

    function currentResultItems() {
      const bid = document.getElementById("results_batch").value;
      return bid ? resultsData.items.filter(i => i.batch_id === bid) : resultsData.items;
    }

    function renderResults() {
      const items = currentResultItems();
      const body = document.getElementById("results_body");
      const pending = items.filter(i => i.status === "locked" || i.status === "manual");

      // 顶栏常驻提醒：待支付的单有时限，漏付就白抢
      const badge = document.getElementById("pending_badge");
      const allPending = resultsData.items.filter(i => i.status === "locked" || i.status === "manual").length;
      badge.textContent = allPending ? `待处理 ${allPending}` : "";
      badge.classList.toggle("hidden", allPending === 0);

      document.getElementById("results_summary").textContent =
        items.length ? `共 ${items.length} 单，待处理 ${pending.length}` : "";
      document.getElementById("btn_export_results").disabled = items.length === 0;
      document.getElementById("btn_del_batch").disabled = !document.getElementById("results_batch").value;

      if (!items.length) {
        body.innerHTML = `<div class="py-8 text-center text-[13px]" style="color:var(--ink-3)">
          还没有抢到的订单<br><span class="text-xs">抢中并锁单后会自动记录在这里</span></div>`;
        return;
      }

      // 待处理的排在最前面：这些是需要你现在就去做事的
      const order = { locked: 0, manual: 1, paid: 2, expired: 3 };
      const sorted = [...items].sort((a, b) =>
        (order[a.status] ?? 9) - (order[b.status] ?? 9) ||
        (b.locked_at || "").localeCompare(a.locked_at || ""));

      // 固定列宽 + 表头不换行：不设的话浏览器会按内容自动分配，
      // 结果是「张数」这种两字表头被折成两行、「需人工确认」被压成竖排。
      // 场次/票档最长，给它剩余空间并溢出省略，鼠标悬停看全文。
      body.innerHTML = `<table class="tb" style="table-layout:fixed">
        <colgroup>
          <col style="width:15%"><col><col style="width:52px">
          <col style="width:19%"><col style="width:11%"><col style="width:76px"><col style="width:132px">
        </colgroup>
        <thead><tr>
          <th class="whitespace-nowrap">抢票人</th><th class="whitespace-nowrap">场次 / 票档</th>
          <th class="whitespace-nowrap">张数</th><th class="whitespace-nowrap">订单号</th>
          <th class="whitespace-nowrap">锁单时间</th><th class="whitespace-nowrap">状态</th><th></th>
        </tr></thead><tbody>` + sorted.map(it => {
        const seq = it.browser_seq != null ? `窗口 ${it.browser_seq}` : "";
        // 订单号抓不到时给的是可操作的指引，而不是一个空格子——
        // 用户看到空的会以为出错了，实际上票是抢到了的
        const orderCell = it.order_id
          ? `<span style="font-variant-numeric:tabular-nums">${escapeHtml(it.order_id)}</span>`
          : `<span class="text-xs" style="color:var(--ink-3)" title="订单号没抓到，请打开${seq || "对应窗口"}在页面上查看">未抓到 · 见${seq || "窗口"}</span>`;
        const statusStyle = (it.status === "locked" || it.status === "manual")
          ? 'style="color:#b91c1c;font-weight:600"' : 'style="color:var(--ink-3)"';
        const actions = (it.status === "locked" || it.status === "manual")
          ? `<button onclick="markResult('${it.id}','paid')" class="btn btn-sm">标记已付</button>
             <button onclick="markResult('${it.id}','expired')" class="btn btn-sm">已过期</button>`
          : `<button onclick="markResult('${it.id}','locked')" class="btn btn-sm">撤销标记</button>`;
        return `<tr>
          <td class="truncate" title="${escapeHtml(it.account_label)} ${escapeHtml(it.email || "")}">
              <div class="truncate">${escapeHtml(it.account_label)}</div>
              <div class="text-xs truncate" style="color:var(--ink-3)">${escapeHtml(it.email || "")} ${seq}</div></td>
          <td title="${escapeHtml(it.session_text)} / ${escapeHtml(it.tier_text)}">
              <div class="text-xs truncate">${escapeHtml(it.session_text)}</div>
              <div class="text-xs truncate" style="color:var(--ink-2)">${escapeHtml(it.tier_text)}</div></td>
          <td>${it.quantity}</td>
          <td class="truncate">${orderCell}</td>
          <td class="text-xs whitespace-nowrap" style="color:var(--ink-2)">${escapeHtml((it.locked_at || "").replace("T", " ").slice(5))}</td>
          <td class="text-xs whitespace-nowrap" ${statusStyle}>${escapeHtml(it.status_label || it.status)}</td>
          <td class="text-right whitespace-nowrap">${actions}</td>
        </tr>`;
      }).join("") + "</tbody></table>";
    }

    function markResult(id, status) {
      fetch("/ticket/results/status", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, status })
      }).then(r => r.json()).then(d => {
        appendLog(d.result, d.code === 200 ? "info" : "error");
        if (d.code === 200) loadResults();
      }).catch(e => appendLog(`标记失败: ${e.message}`, "error"));
    }

    function exportResults() {
      const bid = document.getElementById("results_batch").value;
      // 直接跳转让浏览器走下载，不用 fetch——fetch 拿到的是内存里的数据，
      // 还得自己造 blob 和 <a download>，没必要
      window.location.href = "/ticket/results/export.csv" + (bid ? `?batch_id=${bid}` : "");
    }

    function deleteResultBatch() {
      const bid = document.getElementById("results_batch").value;
      if (!bid) return;
      const b = resultsData.batches[bid];
      const n = resultsData.items.filter(i => i.batch_id === bid).length;
      if (!confirm(`确定删除「${b ? b.event_name : bid}」这一批的 ${n} 条记录？\n\n删了就找不回来了，建议先导出 CSV。`)) return;
      fetch("/ticket/results/batch/delete", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ batch_id: bid })
      }).then(r => r.json()).then(d => {
        appendLog(d.result, d.code === 200 ? "warning" : "error");
        if (d.code === 200) { document.getElementById("results_batch").value = ""; loadResults(); }
      }).catch(e => appendLog(`删除失败: ${e.message}`, "error"));
    }

    function scrollToResults() {
      document.getElementById("results_card").scrollIntoView({ behavior: "smooth", block: "center" });
    }

    document.addEventListener("DOMContentLoaded", () => {
      initGlobalLogStream();
      loadResults();
      loadBrowsers().then(loadAccounts).then(loadPlans).then(loadEvent)
        .then(() => { if (accounts.length) refreshLoginStatus(); });
    });
  </script>
</body>
